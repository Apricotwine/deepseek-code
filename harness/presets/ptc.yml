# DeepSeek Code runtime — DeepSeek Harness kernel, SDK stdio composition.
# stdout is reserved for the JSON-RPC protocol; never add a console logger here.
#
# A fork of examples/jsonrpc-agent/cordis.yml, extended with web search,
# planning, workflow, goal, and a reasoning-effort dial driven by the frontend.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

# DeepSeek adapter. `thinking` + `reasoningEffort` are the thinking-budget dial:
#   non-think -> thinking disabled, reasoningEffort off
#   think     -> reasoningEffort high
#   deep      -> reasoningEffort max
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: !!js "process.env.DSH_REASONING_EFFORT === 'off' ? 'disabled' : 'enabled'"
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
    streamIdleTimeoutMs: 90000

# Time Awareness Layer L0 — the live clock. Injects a durable, source-attributed
# timestamp + "elapsed since the preceding message" reading at each eligible
# pre-step (native `@deepseek-ai/dsh-time-context` plugin).
- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# Sandbox policy — read-only / workspace-write / danger-full-access, driven by
# DSH_PERMISSION_MODE from the frontend.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Time Awareness Layer L1 — stamp accepted tool results with their production
# time + per-tool freshness horizon. A local relative plugin (loaded via tsx in
# dev, resolved against this config's directory).
- id: time-awareness-tool-result
  name: './tal-tool-result.mjs'

# PTC mode — programmatic tool calling (run_code).
- id: code-runtime
  name: '@deepseek-ai/dsh-code-runtime-worker-thread'
